name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parkvanta
          POSTGRES_PASSWORD: parkvanta
          POSTGRES_DB: parkvanta
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U parkvanta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://parkvanta:parkvanta@localhost:55432/parkvanta
          JWT_SECRET: ci-secret-key-that-is-long-enough-for-validation
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: pytest -q

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parkvanta
          POSTGRES_PASSWORD: parkvanta
          POSTGRES_DB: parkvanta
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U parkvanta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run browser tests
        working-directory: apps/web
        run: npm run test:e2e

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type-check and build
        working-directory: apps/web
        run: npm run build
