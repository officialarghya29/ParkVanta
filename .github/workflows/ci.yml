name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parkvanta
          POSTGRES_PASSWORD: parkvanta
          POSTGRES_DB: parkvanta
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U parkvanta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://parkvanta:parkvanta@localhost:55432/parkvanta
          JWT_SECRET: ci-secret-key-that-is-long-enough-for-validation
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: pytest -q

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parkvanta
          POSTGRES_PASSWORD: parkvanta
          POSTGRES_DB: parkvanta
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U parkvanta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:e2e

  security:
    name: Lint and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install quality tools
        run: pip install -r backend/requirements-dev.txt
      - name: Lint backend
        run: ruff check backend
      - name: Scan backend for high-severity issues
        run: bandit -q -r backend -lll
      - name: Audit Python dependencies
        run: pip-audit --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production frontend dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all frontend dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type-check and build
        working-directory: apps/web
        run: npm run build
      - name: Enforce bundle size budget
        run: node scripts/check_bundle_size.mjs

  images:
    name: Docker image size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build --tag parkvanta-api:ci backend
      - name: Build web image
        run: docker build --tag parkvanta-web:ci apps/web
      - name: Enforce image size budgets
        run: |
          set -euo pipefail
          api_size=$(docker image inspect --format '{{.Size}}' parkvanta-api:ci)
          web_size=$(docker image inspect --format '{{.Size}}' parkvanta-web:ci)
          echo "API image: $((api_size / 1024 / 1024)) MiB (budget 450 MiB)"
          echo "Web image: $((web_size / 1024 / 1024)) MiB (budget 120 MiB)"
          test "$api_size" -le $((450 * 1024 * 1024))
          test "$web_size" -le $((120 * 1024 * 1024))
