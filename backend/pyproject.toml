[project]
name = "parkvanta-backend"
version = "0.1.0"
description = "ParkVanta visitor verification and parking allocation API"
requires-python = ">=3.12"
license = { text = "Proprietary — all rights reserved by the ParkVanta Team" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
